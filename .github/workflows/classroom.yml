name: Classroom Checks

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  # === Job для перевірки тестів та статичного аналізу ===
  build:
    name: Build + Tests + Static Analysis
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CHATGPT_MODEL: gpt-5-nano
      CHATGPT_PROMPT: >
        Проаналізуй наступний код студента мовою Java.
        Перевір коректність виконання завдання, логіку та стиль.
        Склади короткий звіт.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 1) Compile
      - name: Compile project
        working-directory: ./app
        run: mvn -B -ntp -DskipTests=true clean package

      # 2) Run Unit Tests
      - name: Run Tests
        working-directory: ./app
        run: mvn -B -ntp test || echo "⚠️ Tests failed but job continues"

      # 3) Checkstyle (soft)
      - name: Run Checkstyle
        working-directory: ./app
        run: mvn -B -ntp checkstyle:checkstyle || echo "⚠️ Checkstyle issues"

      # 4) PMD (soft)
      - name: Run PMD
        working-directory: ./app
        run: mvn -B -ntp pmd:check || echo "⚠️ PMD issues"

      # 5) SpotBugs (soft)
      - name: Run SpotBugs
        working-directory: ./app
        run: mvn -B -ntp com.github.spotbugs:spotbugs-maven-plugin:check || echo "⚠️ SpotBugs issues"

      # 6) Spotless (soft)
      - name: Spotless check
        working-directory: ./app
        run: mvn -B -ntp spotless:check || echo "⚠️ Spotless issues"

      # 7) Generate ChatGPT report (soft)
      - name: Collect Java files
        id: target
        run: |
          git ls-files | grep -E 'app/src/.*/ua/opnu/.*\.java$' > java_files_for_review.txt || true
          COUNT=$(wc -l < java_files_for_review.txt | xargs)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          if [ "$COUNT" -gt 0 ]; then
            echo "has_files=true" >> $GITHUB_OUTPUT
          else
            echo "has_files=false" >> $GITHUB_OUTPUT
          fi

      - name: ChatGPT code review
        if: ${{ steps.target.outputs.has_files == 'true' }}
        run: |
          mkdir -p chatgpt
          python3 -m pip install --upgrade pip requests
          cat > gpt_review.py << 'PY'
import os, json, pathlib, requests
api_key = os.environ.get("OPENAI_API_KEY")
if not api_key:
    pathlib.Path("chatgpt/chatgpt_report.md").write_text("_No API key_", encoding="utf-8")
    exit(0)
model   = os.environ.get("CHATGPT_MODEL","gpt-5-nano")
system_instructions = os.environ.get("CHATGPT_PROMPT")
files = [p.strip() for p in open("java_files_for_review.txt","r").read().splitlines() if p.strip()]
text = ""
for fp in files:
    with open(fp,"r",encoding="utf-8",errors="ignore") as f:
        text += f"\n\n### FILE: {fp}\n```java\n{f.read()}\n```"
headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"}
body = {"model": model, "input": text, "instructions": system_instructions, "text": {"format": {"type":"text"}}}
r = requests.post("https://api.openai.com/v1/responses", headers=headers, data=json.dumps(body))
if r.status_code == 200:
    data = r.json()
    out = data.get("output_text") or "_No text output_"
    pathlib.Path("chatgpt/chatgpt_report.md").write_text(out, encoding="utf-8")
else:
    pathlib.Path("chatgpt/chatgpt_report.md").write_text(f"API error {r.status_code}", encoding="utf-8")
PY
          python3 gpt_review.py

      - name: Ensure ChatGPT report exists
        if: always()
        run: |
          if [ ! -f chatgpt/chatgpt_report.md ]; then
            mkdir -p chatgpt
            echo "_Not generated_" > chatgpt/chatgpt_report.md

      # 8) Upload reports
      - name: Archive reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            chatgpt/chatgpt_report.md
            app/target/checkstyle-result.xml
            app/target/site/checkstyle.html
            app/target/site/pmd.html
